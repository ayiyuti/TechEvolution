# Gradle 内存与性能（手机端建议保持较低内存、关闭并行）
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

# Minecraft / NeoForge 版本（Neo 版本必须与 Minecraft 版本匹配）
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.259
loader_version_range=[1,)

# 模组信息
mod_id=techevolution
mod_name=Tech Evolution
mod_license=MIT
mod_version=1.0.0
mod_authors=WorkBuddy
mod_description=随着科技发展与时间推移，怪物不断进化变强、变聪明，并在后期主动破坏你的产线。
mod_group_id=com.example.techevolution
